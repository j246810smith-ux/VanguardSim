name: Wrong card effect or rule
description: A card or game rule behaves differently from its text or the official rules.
labels: [cards-rules]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Filled in when you come from the game.
  - type: input
    id: card
    attributes:
      label: Card (set and number)
      placeholder: BT08-016 Military Dragon, Raptor Colonel
  - type: textarea
    id: expected
    attributes:
      label: What the card text or rule says
      description: Quote the card text, or the Comprehensive Rules section / official ruling if you know it.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What the simulator did
    validations:
      required: true
  - type: input
    id: seed
    attributes:
      label: Seed (if in a game)
      placeholder: '123456'
