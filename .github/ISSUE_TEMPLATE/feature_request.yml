name: Suggestion
description: An idea or improvement (AI, UI, deck building, missing sets …).
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like, and why?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Filled in when you come from the game.
  - type: markdown
    attributes:
      value: >
        Card artwork is never included (see THIRD_PARTY_NOTICES.md).
